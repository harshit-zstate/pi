name: Build Binaries

# Releases are GitHub-only: Linux binaries (for Docker/Harbor) and npm tarballs are attached to a
# GitHub Release on this repository. Nothing is published to npm.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.0-harness.1)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build (defaults to tag; use only for release recovery)'
        required: false
        type: string

permissions: {}

concurrency:
  group: build-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/pi-${VERSION}-source.tar.gz"

      - name: Build Linux binaries from source archive
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/pi-${VERSION}-source.tar.gz" -C "${build_root}"
          "${build_root}/pi-${VERSION}/scripts/build-binaries.sh" \
            --offline-model-data \
            --platform linux-x64 \
            --platform linux-arm64 \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Prepare release payload
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md
          cp packages/coding-agent/binaries/pi-linux-x64.tar.gz packages/coding-agent/binaries/pi-linux-arm64.tar.gz release-assets/

      - name: Upload release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-test-binaries:
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    permissions:
      actions: read
    steps:
      - name: Checkout smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download binary archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Smoke-test binary
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf "release-assets/pi-${{ matrix.platform }}.tar.gz" -C extracted
          extracted/pi/pi --help
          extracted/pi/pi --version
          node scripts/smoke-test-tool-folders-binary.mjs extracted/pi/pi

  verify-and-pack:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Build the pi-env daemon for tests
        run: npm run build:daemon --workspace packages/env

      - name: Test
        run: npm test

      - name: Smoke-test packed npm consumer
        run: npm run check:package-install

      - name: Pack npm tarballs
        run: node scripts/pack-packages.mjs --skip-build --out .artifacts/npm

      - name: Upload npm tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs-${{ env.RELEASE_TAG }}
          path: .artifacts/npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - smoke-test-binaries
      - verify-and-pack
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Create and publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd release-assets
          sha256sum *.tar.gz *.tgz > SHA256SUMS
          assets=(*.tar.gz *.tgz SHA256SUMS)

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          # Upload into a draft first so a failed upload never leaves a partial public release.
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${assets[@]}"
          gh release edit "${RELEASE_TAG}" --draft=false --latest

      - name: Delete the draft release after a failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi
